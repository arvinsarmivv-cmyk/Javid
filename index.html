<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جاویدنامان</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

header{
    height:70px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    background:rgba(5,5,5,.86);
    backdrop-filter:blur(18px);

    border-bottom:1px solid #222;
}

.logo{
    font-size:18px;
    font-weight:bold;
}

.logo small{
    display:block;
    color:#666;
    font-size:9px;
    margin-top:5px;
    font-weight:normal;
}

.add{
    border:1px solid #444;
    background:#fff;
    color:#000;

    padding:10px 18px;

    border-radius:25px;

    cursor:pointer;

    font-family:inherit;
}

.hero{
    min-height:75vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:120px 20px 60px;
}

.hero h1{
    margin:0;

    font-size:
        clamp(50px,12vw,110px);

    font-weight:300;

    letter-spacing:5px;
}

.hero-line{
    width:70px;
    height:1px;

    background:#555;

    margin:30px auto;
}

.hero p{
    max-width:600px;

    margin:auto;

    color:#777;

    font-size:13px;

    line-height:2.2;
}

.search{
    width:100%;
    max-width:500px;

    margin:40px auto 0;
}

.search input{
    width:100%;
    height:52px;

    border:1px solid #292929;

    border-radius:30px;

    background:#0b0b0b;

    color:#fff;

    padding:0 22px;

    outline:none;

    font-family:inherit;
}

.search input:focus{
    border-color:#666;
}

.section{
    max-width:1200px;

    margin:auto;

    padding:20px;
}

.section-title{
    text-align:center;

    font-size:25px;

    font-weight:400;

    margin-bottom:40px;
}

.grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(260px,1fr)
        );

    gap:22px;
}

.card{
    overflow:hidden;

    background:#0c0c0c;

    border:1px solid #222;

    border-radius:18px;

    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);

    border-color:#444;
}

.photo{
    height:310px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #171717,
            #070707
        );
}

.photo a{
    text-decoration:none;

    color:#aaa;

    border:1px solid #444;

    border-radius:25px;

    padding:11px 18px;

    font-size:11px;
}

.photo a:hover{
    background:#fff;
    color:#000;
}

.no-photo{
    color:#444;
    font-size:12px;
}

.info{
    padding:22px;
}

.name{
    font-size:21px;

    margin-bottom:18px;
}

.row{
    display:flex;

    justify-content:space-between;

    padding:10px 0;

    border-bottom:1px solid #1c1c1c;

    font-size:12px;
}

.row:last-child{
    border-bottom:0;
}

.row span:first-child{
    color:#666;
}

.row span:last-child{
    color:#ddd;
}

.loading,
.empty{
    text-align:center;

    color:#555;

    padding:70px 20px;
}

footer{
    margin-top:100px;

    padding:45px 20px;

    text-align:center;

    color:#444;

    font-size:10px;

    border-top:1px solid #151515;
}

.music{
    position:fixed;

    left:20px;
    bottom:20px;

    width:52px;
    height:52px;

    border-radius:50%;

    border:1px solid #333;

    background:#111;

    color:#fff;

    z-index:2000;

    cursor:pointer;

    font-size:16px;
}

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .logo{
        font-size:15px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .photo{
        height:280px;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">

        جاویدنامان

        <small>
            نامشان جاودانه
        </small>

    </div>

    <button
        class="add"
        onclick="openForm()">

        ثبت یادبود

    </button>

</header>


<section class="hero">

    <div>

        <h1>
            جاویدنامان
        </h1>

        <div class="hero-line"></div>

        <p>
            یاد و نام انسان‌هایی که برای همیشه
            در قلب و خاطره‌ها زنده خواهند ماند.
        </p>

        <div class="search">

            <input
                id="search"
                placeholder="جستجوی نام یا شهر..."
                oninput="search()">

        </div>

    </div>

</section>


<section class="section">

    <div class="section-title">
        جاویدنامان
    </div>

    <div
        id="grid"
        class="grid">

        <div class="loading">
            در حال بارگذاری...
        </div>

    </div>

</section>


<footer>

    جاویدنامان ایران

    <br><br>

    نامشان جاودانه

</footer>


<button
    class="music"
    onclick="toggleMusic()"
    id="musicButton">

    ▶

</button>


<audio
    id="music"
    loop>

    <source
        src="music.mp3"
        type="audio/mpeg">

</audio>


<script>

let people=[];


/* =========================
   خواندن data.json
========================= */

async function loadData(){

    const grid =
        document.getElementById("grid");

    try{

        const response =
            await fetch(
                "data.json?v="+Date.now()
            );

        if(!response.ok){

            throw new Error(
                "data.json پیدا نشد"
            );

        }

        people =
            await response.json();

        if(!Array.isArray(people)){

            people=[];

        }

        render(people);

    }

    catch(error){

        console.error(error);

        grid.innerHTML=`

            <div class="empty">

                هنوز جاویدنامی ثبت نشده است.

            </div>

        `;

    }

}


/* =========================
   نمایش افراد
========================= */

function render(list){

    const grid =
        document.getElementById("grid");


    if(list.length===0){

        grid.innerHTML=`

            <div class="empty">

                موردی پیدا نشد.

            </div>

        `;

        return;

    }


    grid.innerHTML =
        list.map(person => {

            const name =
                safe(person.name);

            const age =
                safe(person.age);

            const city =
                safe(person.city);

            const date =
                safe(person.date);

            const telegram =
                person.telegram || "";


            return `

                <article class="card">

                    <div class="photo">

                        ${
                            telegram

                            ?

                            `
                            <a
                                href="${safeURL(telegram)}"
                                target="_blank"
                                rel="noopener">

                                مشاهده عکس

                            </a>
                            `

                            :

                            `
                            <div class="no-photo">

                                تصویر موجود نیست

                            </div>
                            `
                        }

                    </div>


                    <div class="info">

                        <div class="name">

                            ${name}

                        </div>


                        <div class="row">

                            <span>
                                سن
                            </span>

                            <span>
                                ${age}
                            </span>

                        </div>


                        <div class="row">

                            <span>
                                شهر
                            </span>

                            <span>
                                ${city}
                            </span>

                        </div>


                        <div class="row">

                            <span>
                                تاریخ
                            </span>

                            <span>
                                ${date}
                            </span>

                        </div>

                    </div>

                </article>

            `;

        }).join("");

}


/* =========================
   جستجو
========================= */

function search(){

    const q =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const result =
        people.filter(person => {

            const name =
                String(
                    person.name || ""
                ).toLowerCase();

            const city =
                String(
                    person.city || ""
                ).toLowerCase();


            return (
                name.includes(q) ||
                city.includes(q)
            );

        });


    render(result);

}


/* =========================
   امن کردن متن
========================= */

function safe(value){

    return String(
        value ?? "-"
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeURL(value){

    return String(value)
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   موزیک
========================= */

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById(
        "musicButton"
    );


function toggleMusic(){

    if(music.paused){

        music.play()
        .then(()=>{

            musicButton.innerText="Ⅱ";

        })
        .catch(()=>{

            alert(
                "فایل music.mp3 را در Repository قرار بده."
            );

        });

    }

    else{

        music.pause();

        musicButton.innerText="▶";

    }

}


/* =========================
   فرم کاربر
========================= */

function openForm(){

    alert(
        "فرم ثبت درخواست را در مرحله بعد به همین صفحه اضافه می‌کنیم."
    );

}


/* =========================
   شروع
========================= */

loadData();

</script>

</body>
</html>
