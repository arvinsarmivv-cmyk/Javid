<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>جاویدنامان</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

/* HEADER */

header{
    position:fixed;
    top:0;
    right:0;
    left:0;

    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    background:rgba(5,5,5,.85);
    backdrop-filter:blur(18px);

    border-bottom:1px solid #1c1c1c;

    z-index:1000;
}

.logo{
    text-align:center;

    font-size:18px;
    font-weight:bold;
}

.logo small{
    display:block;

    color:#666;

    font-size:9px;

    margin-top:5px;

    font-weight:normal;
}

.register-button{
    background:#fff;
    color:#000;

    border:0;

    padding:11px 18px;

    border-radius:25px;

    font-family:inherit;

    cursor:pointer;

    font-size:11px;

    transition:.2s;
}

.register-button:hover{
    background:#ddd;
}

/* HERO */

.hero{
    min-height:75vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        110px 20px
        60px;
}

.hero h1{
    margin:0;

    font-size:
        clamp(50px,12vw,105px);

    font-weight:300;

    letter-spacing:6px;
}

.line{
    width:65px;
    height:1px;

    background:#555;

    margin:30px auto;
}

.hero p{
    max-width:650px;

    margin:auto;

    color:#777;

    font-size:13px;

    line-height:2.3;
}

/* SEARCH */

.search{
    max-width:500px;

    margin:38px auto 0;
}

.search input{
    width:100%;

    height:50px;

    border:1px solid #282828;

    border-radius:30px;

    background:#0b0b0b;

    color:#fff;

    outline:none;

    padding:0 20px;

    font-family:inherit;
}

.search input:focus{
    border-color:#555;
}

/* PEOPLE */

.section{
    max-width:1150px;

    margin:auto;

    padding:20px;
}

.title{
    text-align:center;

    font-size:25px;

    font-weight:400;

    margin-bottom:35px;
}

.people{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(260px,1fr)
        );

    gap:20px;
}

.card{
    overflow:hidden;

    background:#0b0b0b;

    border:1px solid #222;

    border-radius:18px;

    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);

    border-color:#444;
}

.photo{
    height:290px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #181818,
            #070707
        );
}

.photo a{
    color:#aaa;

    text-decoration:none;

    border:1px solid #444;

    border-radius:25px;

    padding:10px 18px;

    font-size:11px;
}

.photo a:hover{
    background:#fff;
    color:#000;
}

.no-photo{
    color:#444;
    font-size:11px;
}

.info{
    padding:20px;
}

.name{
    font-size:20px;

    margin-bottom:15px;
}

.row{
    display:flex;

    justify-content:space-between;

    padding:9px 0;

    border-bottom:1px solid #191919;

    font-size:12px;
}

.row:last-child{
    border-bottom:0;
}

.row span:first-child{
    color:#666;
}

.row span:last-child{
    color:#ccc;
}

/* LOADING */

.loading,
.empty{
    text-align:center;

    color:#555;

    padding:60px 20px;
}

/* MODAL */

.modal{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(10px);

    z-index:5000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;

    max-width:570px;

    max-height:90vh;

    overflow-y:auto;

    background:#0b0b0b;

    border:1px solid #292929;

    border-radius:20px;

    padding:25px;

    position:relative;

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.7);
}

.close{
    position:absolute;

    top:15px;
    left:15px;

    width:35px;
    height:35px;

    border-radius:50%;

    border:1px solid #333;

    background:#111;

    color:#fff;

    cursor:pointer;

    font-size:18px;

    line-height:30px;
}

.modal-box h2{
    text-align:center;

    font-weight:400;

    margin:
        5px 0
        12px;
}

.modal-box p{
    text-align:center;

    color:#666;

    font-size:11px;

    line-height:2;

    margin-bottom:25px;
}

.field{
    margin-top:16px;
}

.field label{
    display:block;

    color:#999;

    font-size:11px;

    margin-bottom:7px;
}

.field input{
    width:100%;

    height:45px;

    padding:0 13px;

    background:#060606;

    color:#fff;

    border:1px solid #292929;

    border-radius:10px;

    outline:none;

    font-family:inherit;
}

.field input:focus{
    border-color:#555;
}

.dates{
    display:flex;

    gap:10px;
}

.date{
    flex:1;

    height:45px;

    border-radius:10px;

    border:1px solid #292929;

    background:#060606;

    color:#888;

    font-family:inherit;

    cursor:pointer;
}

.date.selected{
    background:#fff;

    color:#000;

    border-color:#fff;
}

.submit{
    width:100%;

    height:48px;

    margin-top:22px;

    border:0;

    border-radius:10px;

    background:#fff;

    color:#000;

    font-family:inherit;

    cursor:pointer;
}

.submit:hover{
    background:#ddd;
}

#status{
    text-align:center;

    font-size:11px;

    line-height:2;

    margin-top:15px;

    color:#777;
}

/* FOOTER */

footer{
    margin-top:100px;

    padding:45px 20px;

    text-align:center;

    color:#444;

    font-size:10px;

    border-top:1px solid #151515;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .logo{
        font-size:15px;
    }

    .register-button{
        padding:9px 13px;
    }

    .hero h1{
        letter-spacing:3px;
    }

    .people{
        grid-template-columns:1fr;
    }

    .modal{
        padding:12px;
    }

    .modal-box{
        padding:22px 17px;
        max-height:92vh;
    }

}

</style>
</head>

<body>


<!-- HEADER -->

<header>

    <div class="logo">

        جاویدنامان

        <small>
            نامشان جاودانه
        </small>

    </div>


    <button
        class="register-button"
        onclick="openForm()">

        ثبت یادبود

    </button>

</header>


<!-- HERO -->

<section class="hero">

    <div>

        <h1>
            جاویدنامان
        </h1>

        <div class="line"></div>

        <p>
            نام و یاد کسانی که برای همیشه
            در خاطره‌ها زنده خواهند ماند.
        </p>

        <div class="search">

            <input
                id="search"
                placeholder="جستجوی نام یا شهر..."
                oninput="searchPeople()">

        </div>

    </div>

</section>


<!-- PEOPLE -->

<section class="section">

    <div class="title">
        جاویدنامان
    </div>

    <div
        id="people"
        class="people">

        <div class="loading">
            در حال بارگذاری...
        </div>

    </div>

</section>


<!-- REGISTER MODAL -->

<div
    id="modal"
    class="modal"
    onclick="outsideClose(event)">

    <div class="modal-box">

        <button
            class="close"
            onclick="closeForm()">

            ×

        </button>


        <h2>
            ثبت یادبود
        </h2>


        <p>
            اطلاعات را وارد کنید.
            پس از بررسی و تأیید مدیر،
            یادبود در سایت نمایش داده خواهد شد.
        </p>


        <div class="field">

            <label>
                نام و نام خانوادگی
            </label>

            <input
                id="name"
                placeholder="نام و نام خانوادگی">

        </div>


        <div class="field">

            <label>
                سن
            </label>

            <input
                id="age"
                type="number"
                placeholder="سن">

        </div>


        <div class="field">

            <label>
                شهر
            </label>

            <input
                id="city"
                placeholder="شهر">

        </div>


        <div class="field">

            <label>
                تاریخ
            </label>

            <div class="dates">

                <button
                    class="date"
                    onclick="selectDate(
                        this,
                        '۱۸ دی ۱۴۰۴'
                    )">

                    ۱۸ دی ۱۴۰۴

                </button>


                <button
                    class="date"
                    onclick="selectDate(
                        this,
                        '۱۹ دی ۱۴۰۴'
                    )">

                    ۱۹ دی ۱۴۰۴

                </button>

            </div>

        </div>


        <div class="field">

            <label>
                لینک پیام تلگرام عکس
            </label>

            <input
                id="telegram"
                placeholder="https://t.me/...">

        </div>


        <button
            class="submit"
            onclick="sendRequest()">

            ارسال درخواست

        </button>


        <div id="status"></div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    جاویدنامان ایران

    <br><br>

    نامشان جاودانه

</footer>


<!-- MUSIC -->

<audio
    id="music"
    src="music.mp3"
    loop
    preload="auto">
</audio>


<script>


/* =========================
   API
========================= */

const API =
    "https://javidnam-api.ahmad1250wxdadzh.workers.dev";


let people = [];

let selectedDate = "";


/* =========================
   FORM
========================= */

function openForm(){

    document
    .getElementById("modal")
    .classList.add("show");

    document.body.style.overflow =
        "hidden";

}


function closeForm(){

    document
    .getElementById("modal")
    .classList.remove("show");

    document.body.style.overflow =
        "";

}


function outsideClose(event){

    if(
        event.target ===
        document.getElementById("modal")
    ){

        closeForm();

    }

}


/* =========================
   DATE
========================= */

function selectDate(button,date){

    document
    .querySelectorAll(".date")
    .forEach(
        x =>
        x.classList.remove(
            "selected"
        )
    );


    button.classList.add(
        "selected"
    );


    selectedDate = date;

}


/* =========================
   SEND REQUEST
========================= */

async function sendRequest(){

    const status =
        document.getElementById(
            "status"
        );


    const name =
        document
        .getElementById("name")
        .value.trim();


    const age =
        document
        .getElementById("age")
        .value.trim();


    const city =
        document
        .getElementById("city")
        .value.trim();


    const telegram =
        document
        .getElementById("telegram")
        .value.trim();


    if(
        !name ||
        !age ||
        !city ||
        !selectedDate
    ){

        status.innerText =
            "لطفاً همه اطلاعات را کامل کنید.";

        return;

    }


    if(
        telegram &&
        !telegram.startsWith(
            "https://t.me/"
        )
    ){

        status.innerText =
            "لینک تلگرام صحیح نیست.";

        return;

    }


    status.innerText =
        "در حال ارسال درخواست...";


    try{

        const r =
            await fetch(
                API + "/requests",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        name:name,

                        age:age,

                        city:city,

                        date:selectedDate,

                        telegram:telegram

                    })

                }
            );


        const result =
            await r.json();


        if(
            !r.ok ||
            !result.ok
        ){

            throw new Error(
                result.error ||
                "ارسال ناموفق بود"
            );

        }


        status.innerText =
            "درخواست شما با موفقیت ثبت شد.";


        document
        .getElementById("name")
        .value = "";


        document
        .getElementById("age")
        .value = "";


        document
        .getElementById("city")
        .value = "";


        document
        .getElementById("telegram")
        .value = "";


        selectedDate = "";


        document
        .querySelectorAll(".date")
        .forEach(
            x =>
            x.classList.remove(
                "selected"
            )
        );


        setTimeout(
            closeForm,
            1500
        );


    }

    catch(error){

        console.error(error);

        status.innerText =
            "ارسال انجام نشد. دوباره تلاش کنید.";

    }

}


/* =========================
   LOAD PEOPLE
========================= */

async function loadPeople(){

    const box =
        document.getElementById(
            "people"
        );


    try{

        const r =
            await fetch(
                "data.json?v=" +
                Date.now()
            );


        if(!r.ok){

            throw new Error();

        }


        people =
            await r.json();


        if(
            !Array.isArray(people)
        ){

            people = [];

        }


        renderPeople(
            people
        );


    }

    catch(error){

        box.innerHTML = `

            <div class="empty">

                هنوز موردی ثبت نشده است.

            </div>

        `;

    }

}


/* =========================
   RENDER
========================= */

function renderPeople(list){

    const box =
        document.getElementById(
            "people"
        );


    if(!list.length){

        box.innerHTML = `

            <div class="empty">

                موردی پیدا نشد.

            </div>

        `;

        return;

    }


    box.innerHTML =
        list.map(
            person => {

                const name =
                    safe(person.name);

                const age =
                    safe(person.age);

                const city =
                    safe(person.city);

                const date =
                    safe(person.date);

                const telegram =
                    person.telegram || "";


                return `

                    <article class="card">

                        <div class="photo">

                            ${
                                telegram

                                ?

                                `
                                <a
                                    href="${safeURL(
                                        telegram
                                    )}"
                                    target="_blank"
                                    rel="noopener">

                                    مشاهده عکس

                                </a>
                                `

                                :

                                `
                                <div class="no-photo">
                                    تصویر موجود نیست
                                </div>
                                `
                            }

                        </div>


                        <div class="info">

                            <div class="name">
                                ${name}
                            </div>


                            <div class="row">

                                <span>
                                    سن
                                </span>

                                <span>
                                    ${age}
                                </span>

                            </div>


                            <div class="row">

                                <span>
                                    شهر
                                </span>

                                <span>
                                    ${city}
                                </span>

                            </div>


                            <div class="row">

                                <span>
                                    تاریخ
                                </span>

                                <span>
                                    ${date}
                                </span>

                            </div>

                        </div>

                    </article>

                `;

            }
        )
        .join("");

}


/* =========================
   SEARCH
========================= */

function searchPeople(){

    const q =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const result =
        people.filter(
            person => {

                const name =
                    String(
                        person.name || ""
                    )
                    .toLowerCase();


                const city =
                    String(
                        person.city || ""
                    )
                    .toLowerCase();


                return (
                    name.includes(q) ||
                    city.includes(q)
                );

            }
        );


    renderPeople(
        result
    );

}


/* =========================
   SECURITY
========================= */

function safe(value){

    return String(
        value ?? "-"
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


function safeURL(value){

    return String(value)
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================
   MUSIC
========================= */

const music =
    document.getElementById(
        "music"
    );


function startMusic(){

    music.play()
    .catch(
        function(){

            /*
            اگر مرورگر
            autoplay را مسدود کرد،
            اولین لمس صفحه
            موسیقی را شروع می‌کند.
            */

        }
    );

}


startMusic();


document.addEventListener(
    "click",
    function(){

        if(
            music.paused
        ){

            music.play()
            .catch(
                function(){}
            );

        }

    },
    {
        once:true
    }
);


/* =========================
   START
========================= */

loadPeople();

</script>

</body>
</html>
