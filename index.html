<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جاویدنامان</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

header{
    position:fixed;
    top:0;
    right:0;
    left:0;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    background:rgba(5,5,5,.82);
    backdrop-filter:blur(18px);

    border-bottom:1px solid #1d1d1d;

    z-index:100;
}

.logo{
    font-size:18px;
    font-weight:bold;
}

.logo span{
    display:block;
    margin-top:4px;

    font-size:9px;
    font-weight:normal;

    color:#666;
}

.admin{
    text-decoration:none;

    color:#777;

    font-size:11px;

    border:1px solid #222;

    padding:9px 14px;

    border-radius:20px;
}

.hero{
    min-height:70vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        120px 20px
        70px;
}

.hero-content{
    max-width:800px;
}

.hero h1{
    margin:0;

    font-size:
        clamp(48px,12vw,105px);

    font-weight:300;

    letter-spacing:6px;
}

.hero-line{
    width:70px;
    height:1px;

    background:#555;

    margin:30px auto;
}

.hero p{
    color:#777;

    font-size:13px;

    line-height:2.2;
}

.search-box{
    max-width:500px;

    margin:
        35px auto
        0;
}

.search-box input{
    width:100%;

    height:50px;

    padding:
        0 20px;

    border:
        1px solid #292929;

    border-radius:30px;

    background:#0c0c0c;

    color:#fff;

    outline:none;

    font-family:inherit;
}

.search-box input:focus{
    border-color:#555;
}

.section{
    max-width:1100px;

    margin:auto;

    padding:
        20px;
}

.section-title{
    text-align:center;

    font-size:25px;

    font-weight:400;

    margin-bottom:35px;
}

.people{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(260px,1fr)
        );

    gap:18px;
}

.person{
    position:relative;

    overflow:hidden;

    background:#0c0c0c;

    border:
        1px solid #222;

    border-radius:20px;

    transition:
        transform .25s,
        border-color .25s;
}

.person:hover{
    transform:translateY(-5px);

    border-color:#444;
}

.person-image{
    height:250px;

    background:
        linear-gradient(
            135deg,
            #111,
            #050505
        );

    display:flex;

    align-items:center;

    justify-content:center;
}

.person-image a{
    color:#888;

    text-decoration:none;

    border:
        1px solid #333;

    padding:10px 15px;

    border-radius:20px;

    font-size:11px;
}

.person-info{
    padding:20px;
}

.person-name{
    font-size:20px;

    margin-bottom:15px;
}

.info{
    display:flex;

    justify-content:space-between;

    border-bottom:
        1px solid #1b1b1b;

    padding:
        9px 0;

    font-size:12px;
}

.info span:first-child{
    color:#666;
}

.info span:last-child{
    color:#ccc;
}

.loading{
    text-align:center;

    color:#666;

    padding:50px;
}

.empty{
    text-align:center;

    color:#555;

    padding:50px;

    border:
        1px solid #191919;

    border-radius:20px;
}

.music-button{
    position:fixed;

    bottom:22px;
    left:22px;

    width:52px;
    height:52px;

    border-radius:50%;

    border:
        1px solid #333;

    background:#101010;

    color:#fff;

    cursor:pointer;

    z-index:200;

    font-size:16px;

    box-shadow:
        0 5px 30px
        rgba(0,0,0,.5);
}

.music-button.playing{
    border-color:#777;
}

.music-text{
    position:fixed;

    bottom:32px;
    left:85px;

    color:#555;

    font-size:10px;

    opacity:0;

    transition:.3s;

    pointer-events:none;
}

.music-text.show{
    opacity:1;
}

footer{
    margin-top:100px;

    padding:
        40px 20px;

    text-align:center;

    color:#444;

    font-size:10px;

    border-top:
        1px solid #151515;
}


/* موبایل */

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .logo{
        font-size:15px;
    }

    .hero h1{
        letter-spacing:3px;
    }

    .people{
        grid-template-columns:1fr;
    }

    .person-image{
        height:230px;
    }

}

</style>
</head>


<body>


<header>

    <div class="logo">

        جاویدنامان

        <span>
            یادشان جاودانه
        </span>

    </div>

    <a
        class="admin"
        href="admin.html">

        مدیریت

    </a>

</header>



<section class="hero">

    <div class="hero-content">

        <h1>
            جاویدنامان
        </h1>

        <div class="hero-line"></div>

        <p>
            نام و یاد کسانی که برای همیشه
            در خاطره‌ها زنده خواهند ماند.
        </p>

        <div class="search-box">

            <input
                id="search"
                type="text"
                placeholder="جستجوی نام یا شهر..."
                oninput="searchPeople()">

        </div>

    </div>

</section>



<section class="section">

    <div class="section-title">
        جاویدنامان
    </div>

    <div
        id="people"
        class="people">

        <div class="loading">
            در حال دریافت اطلاعات...
        </div>

    </div>

</section>



<footer>

    جاویدنامان ایران

    <br><br>

    نامشان جاودانه

</footer>



<button
    id="musicButton"
    class="music-button"
    onclick="toggleMusic()">

    ▶

</button>


<div
    id="musicText"
    class="music-text">

    موسیقی در حال پخش است

</div>



<audio
    id="music"
    loop
    preload="auto">

    <source
        src="music.mp3"
        type="audio/mpeg">

</audio>



<script>


/* =========================
   تنظیمات
========================= */


const DATA_URL =
    "data.json";


let people = [];



/* =========================
   دریافت اطلاعات
========================= */


async function loadPeople(){

    const container =
        document.getElementById(
            "people"
        );

    try{

        const response =
            await fetch(
                DATA_URL +
                "?v=" +
                Date.now()
            );

        if(!response.ok){

            throw new Error(
                "data.json پیدا نشد"
            );

        }

        people =
            await response.json();

        renderPeople(people);

    }

    catch(error){

        console.error(error);

        container.innerHTML = `

            <div class="empty">

                هنوز اطلاعاتی ثبت نشده است.

            </div>

        `;

    }

}



/* =========================
   نمایش افراد
========================= */


function renderPeople(list){

    const container =
        document.getElementById(
            "people"
        );


    if(
        !Array.isArray(list) ||
        list.length === 0
    ){

        container.innerHTML = `

            <div class="empty">

                هنوز جاویدنامی ثبت نشده است.

            </div>

        `;

        return;

    }


    container.innerHTML =
        list
        .map(function(person){

            return createPerson(
                person
            );

        })
        .join("");

}



/* =========================
   ساخت کارت
========================= */


function createPerson(person){

    const name =
        escapeHTML(
            person.name || "بدون نام"
        );

    const age =
        escapeHTML(
            String(
                person.age || "-"
            )
        );

    const city =
        escapeHTML(
            person.city || "-"
        );

    const date =
        escapeHTML(
            person.date || "-"
        );

    const telegram =
        person.telegram || "";


    return `

        <article
            class="person"
            data-name="${name}"
            data-city="${city}">


            <div class="person-image">

                ${
                    telegram
                    ?
                    `
                    <a
                        href="${escapeAttribute(telegram)}"
                        target="_blank"
                        rel="noopener">

                        مشاهده عکس

                    </a>
                    `
                    :
                    `
                    <span
                        style="
                        color:#444;
                        font-size:12px;
                        ">

                        تصویر موجود نیست

                    </span>
                    `
                }

            </div>


            <div class="person-info">

                <div class="person-name">

                    ${name}

                </div>


                <div class="info">

                    <span>
                        سن
                    </span>

                    <span>
                        ${age}
                    </span>

                </div>


                <div class="info">

                    <span>
                        شهر
                    </span>

                    <span>
                        ${city}
                    </span>

                </div>


                <div class="info">

                    <span>
                        تاریخ
                    </span>

                    <span>
                        ${date}
                    </span>

                </div>

            </div>

        </article>

    `;

}



/* =========================
   جستجو
========================= */


function searchPeople(){

    const query =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const filtered =
        people.filter(function(person){

            const name =
                String(
                    person.name || ""
                ).toLowerCase();

            const city =
                String(
                    person.city || ""
                ).toLowerCase();

            return (
                name.includes(query) ||
                city.includes(query)
            );

        });


    renderPeople(filtered);

}



/* =========================
   امنیت نمایش متن
========================= */


function escapeHTML(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll('"',"&quot;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;");

}



/* =========================
   موزیک
========================= */


const music =
    document.getElementById(
        "music"
    );


const musicButton =
    document.getElementById(
        "musicButton"
    );


const musicText =
    document.getElementById(
        "musicText"
    );


async function toggleMusic(){

    if(music.paused){

        try{

            await music.play();

            musicButton.innerText =
                "Ⅱ";

            musicButton.classList.add(
                "playing"
            );

            musicText.classList.add(
                "show"
            );

            setTimeout(function(){

                musicText.classList.remove(
                    "show"
                );

            },3000);

        }

        catch(error){

            alert(
                "فایل music.mp3
