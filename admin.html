<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>مدیریت جاویدنامان</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:#fff;
font-family:Tahoma,Arial,sans-serif;
}

header{
padding:30px 20px;
text-align:center;
border-bottom:1px solid #222;
}

h1{
font-size:23px;
font-weight:400;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:25px 15px;
}

.login{
max-width:400px;
margin:80px auto;
background:#0b0b0b;
border:1px solid #252525;
border-radius:18px;
padding:25px;
}

.login h2{
text-align:center;
font-weight:400;
}

input{
width:100%;
height:48px;
background:#050505;
border:1px solid #333;
border-radius:10px;
color:#fff;
padding:0 15px;
font-family:inherit;
outline:none;
}

button{
height:46px;
border:0;
border-radius:10px;
font-family:inherit;
cursor:pointer;
}

.login button{
width:100%;
margin-top:15px;
background:#fff;
color:#000;
}

#error{
text-align:center;
color:#888;
font-size:11px;
margin-top:15px;
}

.panel{
display:none;
}

.refresh{
width:100%;
background:#111;
border:1px solid #333;
color:#fff;
margin-bottom:20px;
}

.status{
text-align:center;
color:#777;
font-size:12px;
margin-bottom:20px;
}

.card{
background:#0b0b0b;
border:1px solid #242424;
border-radius:16px;
padding:20px;
margin-bottom:15px;
}

.name{
font-size:20px;
margin-bottom:15px;
}

.row{
display:flex;
justify-content:space-between;
gap:20px;
padding:9px 0;
border-bottom:1px solid #1b1b1b;
font-size:12px;
}

.label{
color:#666;
}

.actions{
display:flex;
gap:10px;
margin-top:20px;
}

.approve{
flex:1;
background:#fff;
color:#000;
}

.delete{
flex:1;
background:#171717;
color:#fff;
border:1px solid #333;
}

.empty{
text-align:center;
color:#555;
padding:60px 20px;
}

@media(max-width:600px){

.actions{
flex-direction:column;
}

.row{
flex-direction:column;
gap:5px;
}

}

</style>

</head>

<body>

<header>

<h1>
پنل مدیریت جاویدنامان
</h1>

</header>


<div class="container">


<!-- LOGIN -->

<div
id="login"
class="login">

<h2>
ورود مدیر
</h2>

<input
id="password"
type="password"
placeholder="رمز عبور">

<button
onclick="login()">

ورود

</button>

<div id="error"></div>

</div>


<!-- PANEL -->

<div
id="panel"
class="panel">

<button
class="refresh"
onclick="loadRequests()">

بروزرسانی درخواست‌ها

</button>

<div
id="status"
class="status">

</div>

<div
id="requests">

</div>

</div>

</div>


<script>

const API =
"https://javidnam-api.ahmad1250wxdadzh.workers.dev";

let adminPassword = "";


/* ورود */

async function login(){

const password =
document
.getElementById("password")
.value;

if(!password){

document
.getElementById("error")
.innerText =
"رمز را وارد کنید.";

return;

}

adminPassword =
password;


/* تست رمز */

try{

const r =
await fetch(
API + "/requests",
{
headers:{
"X-Admin-Password":
adminPassword
}
}
);

const result =
await r.json();

if(
!r.ok ||
!result.ok
){

adminPassword = "";

document
.getElementById("error")
.innerText =
"رمز اشتباه است.";

return;

}


/* ورود موفق */

document
.getElementById("login")
.style.display =
"none";

document
.getElementById("panel")
.style.display =
"block";

showRequests(
result.requests || []
);

}

catch(error){

adminPassword = "";

document
.getElementById("error")
.innerText =
"خطا در اتصال به سرور.";

}

}


/* نمایش */

function showRequests(list){

const box =
document
.getElementById("requests");

const status =
document
.getElementById("status");


status.innerText =
list.length +
" درخواست";


if(!list.length){

box.innerHTML = `

<div class="empty">

درخواستی وجود ندارد.

</div>

`;

return;

}


box.innerHTML =
list.map(
item => {

return `

<div
class="card"
id="card-${escapeHTML(item.id)}">

<div class="name">

${escapeHTML(item.name)}

</div>


<div class="row">

<span class="label">
سن
</span>

<span>
${escapeHTML(item.age)}
</span>

</div>


<div class="row">

<span class="label">
شهر
</span>

<span>
${escapeHTML(item.city)}
</span>

</div>


<div class="row">

<span class="label">
تاریخ
</span>

<span>
${escapeHTML(item.date)}
</span>

</div>


<div class="row">

<span class="label">
عکس
</span>

<span>

${
item.telegram

?

`<a
href="${safeURL(item.telegram)}"
target="_blank"
style="color:#aaa">

مشاهده عکس

</a>`

:

"ثبت نشده"
}

</span>

</div>


<div class="actions">

<button
class="approve"
onclick="approve('${escapeHTML(item.id)}')">

افزودن به سایت

</button>

<button
class="delete"
onclick="removeRequest('${escapeHTML(item.id)}')">

حذف

</button>

</div>

</div>

`;

}
).join("");

}


/* بروزرسانی */

async function loadRequests(){

try{

const r =
await fetch(
API + "/requests",
{
headers:{
"X-Admin-Password":
adminPassword
}
}
);

const result =
await r.json();

if(
r.status === 401
){

logout();

return;

}

showRequests(
result.requests || []
);

}

catch(error){

document
.getElementById("status")
.innerText =
"خطا در اتصال";

}

}


/* افزودن */

async function approve(id){

if(
!confirm(
"این فرد به سایت اضافه شود؟"
)
){

return;

}

const r =
await fetch(
API + "/approve",
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"X-Admin-Password":
adminPassword
},

body:
JSON.stringify({
id:id
})
}
);

const result =
await r.json();


if(
r.status === 401
){

logout();

return;

}


if(
!result.ok
){

alert(
result.error ||
"خطا در افزودن"
);

return;

}


alert(
"فرد به سایت اضافه شد."
);

loadRequests();

}


/* حذف */

async function removeRequest(id){

if(
!confirm(
"این درخواست حذف شود؟"
)
){

return;

}


const r =
await fetch(
API +
"/requests?id=" +
encodeURIComponent(id),
{
method:"DELETE",

headers:{
"X-Admin-Password":
adminPassword
}
}
);


const result =
await r.json();


if(
r.status === 401
){

logout();

return;

}


if(
!result.ok
){

alert(
result.error ||
"خطا در حذف"
);

return;

}


alert(
"درخواست حذف شد."
);

loadRequests();

}


/* خروج */

function logout(){

adminPassword = "";

document
.getElementById("panel")
.style.display =
"none";

document
.getElementById("login")
.style.display =
"block";

document
.getElementById("password")
.value = "";

}


/* امنیت */

function escapeHTML(value){

return String(
value ?? ""
)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function safeURL(value){

return String(value)
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
