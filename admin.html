<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>پنل مدیریت جاویدنامان</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

header{
    padding:25px 20px;
    text-align:center;
    border-bottom:1px solid #222;
}

header h1{
    margin:0;
    font-size:24px;
    font-weight:400;
}

header p{
    color:#666;
    font-size:11px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:25px 15px;
}

.status{
    text-align:center;
    color:#777;
    font-size:12px;
    margin-bottom:25px;
}

.card{
    background:#0c0c0c;
    border:1px solid #242424;
    border-radius:16px;
    padding:20px;
    margin-bottom:15px;
}

.name{
    font-size:20px;
    margin-bottom:18px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:10px 0;
    border-bottom:1px solid #1c1c1c;
    font-size:12px;
}

.row:last-of-type{
    border-bottom:0;
}

.label{
    color:#666;
}

.value{
    color:#ddd;
    text-align:left;
    direction:rtl;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    flex:1;
    height:44px;
    border:0;
    border-radius:9px;
    font-family:inherit;
    cursor:pointer;
}

.approve{
    background:#fff;
    color:#000;
}

.delete{
    background:#171717;
    color:#fff;
    border:1px solid #333;
}

.approve:hover{
    background:#ddd;
}

.delete:hover{
    background:#222;
}

.empty{
    text-align:center;
    padding:70px 20px;
    color:#555;
}

.refresh{
    display:block;
    margin:0 auto 30px;
    max-width:250px;
    background:#111;
    color:#fff;
    border:1px solid #333;
}

.photo-link{
    color:#aaa;
    text-decoration:none;
}

.photo-link:hover{
    color:#fff;
}

@media(max-width:600px){

    .row{
        flex-direction:column;
        gap:5px;
    }

    .value{
        text-align:right;
    }

    .actions{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<header>

    <h1>
        پنل مدیریت جاویدنامان
    </h1>

    <p>
        مدیریت درخواست‌های ثبت‌شده
    </p>

</header>


<div class="container">

    <button
        class="refresh"
        onclick="loadRequests()">

        بروزرسانی درخواست‌ها

    </button>


    <div
        id="status"
        class="status">

        در حال دریافت درخواست‌ها...

    </div>


    <div
        id="requests">

    </div>

</div>


<script>

const API =
    "https://javidnam-api.ahmad1250wxdadzh.workers.dev";


async function loadRequests(){

    const box =
        document.getElementById(
            "requests"
        );

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        "در حال دریافت درخواست‌ها...";


    try{

        const r =
            await fetch(
                API +
                "/requests?t=" +
                Date.now()
            );


        const result =
            await r.json();


        if(!r.ok || !result.ok){

            throw new Error(
                result.error ||
                "خطا در دریافت درخواست‌ها"
            );

        }


        const requests =
            Array.isArray(
                result.requests
            )
            ?
            result.requests
            :
            [];


        if(!requests.length){

            box.innerHTML = `

                <div class="empty">

                    در حال حاضر
                    درخواست جدیدی وجود ندارد.

                </div>

            `;

            status.innerText =
                "۰ درخواست";

            return;

        }


        status.innerText =
            requests.length +
            " درخواست";


        box.innerHTML =
            requests.map(
                requestCard
            ).join("");


    }

    catch(error){

        console.error(error);

        status.innerText =
            "خطا در دریافت اطلاعات";


        box.innerHTML = `

            <div class="empty">

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================
   کارت درخواست
========================= */

function requestCard(item){

    const id =
        escapeHTML(item.id);


    const name =
        escapeHTML(item.name);


    const age =
        escapeHTML(item.age);


    const city =
        escapeHTML(item.city);


    const date =
        escapeHTML(item.date);


    const telegram =
        item.telegram
        ?
        `
        <a
            class="photo-link"
            href="${safeURL(item.telegram)}"
            target="_blank"
            rel="noopener">

            مشاهده لینک عکس

        </a>
        `
        :
        "ثبت نشده";


    return `

        <div
            class="card"
            id="request-${id}">

            <div class="name">

                ${name}

            </div>


            <div class="row">

                <span class="label">
                    سن
                </span>

                <span class="value">
                    ${age}
                </span>

            </div>


            <div class="row">

                <span class="label">
                    شهر
                </span>

                <span class="value">
                    ${city}
                </span>

            </div>


            <div class="row">

                <span class="label">
                    تاریخ
                </span>

                <span class="value">
                    ${date}
                </span>

            </div>


            <div class="row">

                <span class="label">
                    عکس
                </span>

                <span class="value">
                    ${telegram}
                </span>

            </div>


            <div class="actions">

                <button
                    class="approve"
                    onclick="approve('${id}')">

                    افزودن به سایت

                </button>


                <button
                    class="delete"
                    onclick="deleteRequest('${id}')">

                    حذف درخواست

                </button>

            </div>

        </div>

    `;

}


/* =========================
   تأیید و افزودن
========================= */

async function approve(id){

    if(
        !confirm(
            "این فرد به سایت اضافه شود؟"
        )
    ){

        return;

    }


    try{

        const r =
            await fetch(
                API + "/approve",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        id:id
                    })
                }
            );


        const result =
            await r.json();


        if(!r.ok || !result.ok){

            throw new Error(
                result.error ||
                "افزودن انجام نشد"
            );

        }


        alert(
            "فرد با موفقیت به سایت اضافه شد."
        );


        loadRequests();


    }

    catch(error){

        alert(
            "خطا: " +
            error.message
        );

    }

}


/* =========================
   حذف درخواست
========================= */

async function deleteRequest(id){

    if(
        !confirm(
            "این درخواست حذف شود؟"
        )
    ){

        return;

    }


    try{

        const r =
            await fetch(
                API +
                "/requests?id=" +
                encodeURIComponent(id),
                {
                    method:"DELETE"
                }
            );


        const result =
            await r.json();


        if(!r.ok || !result.ok){

            throw new Error(
                result.error ||
                "حذف انجام نشد"
            );

        }


        alert(
            "درخواست حذف شد."
        );


        loadRequests();


    }

    catch(error){

        alert(
            "خطا: " +
            error.message
        );

    }

}


/* =========================
   امنیت
========================= */

function escapeHTML(value){

    return String(
        value ?? "-"
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeURL(value){

    return String(value)
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   شروع
========================= */

loadRequests();

</script>

</body>
</html>
