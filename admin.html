<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت جاویدنامان</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a0f;color:white;font-family:Tahoma,Arial,sans-serif}
main{max-width:900px;margin:auto;padding:30px 18px}
h1{margin-top:0}
.box{background:#111620;border:1px solid #293241;border-radius:18px;padding:20px;margin-bottom:15px}
input{width:100%;padding:13px;background:#080c12;border:1px solid #303b4c;border-radius:10px;color:white;margin:10px 0;outline:none}
button{border:0;padding:10px 15px;border-radius:9px;font-family:inherit;cursor:pointer}
.login{background:#e5c46c;font-weight:bold}
.approve{background:#65cf91;color:#07140c}
.reject{background:#d96868;color:white}
.delete{background:#3a414e;color:white}
.restore{background:#597ba9;color:white}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.info{color:#a5afbf;font-size:13px;line-height:2}
.status{font-size:13px;color:#e5c46c}
.hidden{display:none}
a{color:#e5ca75}
</style>
</head>
<body>

<main>

<div id="loginBox" class="box">
<h1>🔐 پنل مدیریت</h1>
<p class="info">این قسمت فقط برای مدیر سایت است.</p>
<input id="password" type="password" placeholder="رمز مدیریت">
<button class="login" onclick="login()">ورود</button>
<div id="loginMsg" class="status"></div>
</div>

<div id="panel" class="hidden">

<h1>مدیریت جاویدنامان</h1>

<div id="stats" class="info"></div>

<div id="requests"></div>

</div>

</main>

<script>

const PASSWORD="123456";

function getPeople(){
return JSON.parse(localStorage.getItem("javidnam_people")||"[]");
}

function save(x){
localStorage.setItem("javidnam_people",JSON.stringify(x));
}

function login(){

let pass=document.getElementById("password").value;

if(pass!==PASSWORD){
document.getElementById("loginMsg").textContent="رمز اشتباه است.";
return;
}

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("panel").classList.remove("hidden");

renderAdmin();
}

function renderAdmin(){

let people=getPeople();

let pending=people.filter(x=>x.status==="pending").length;
let approved=people.filter(x=>x.status==="approved").length;
let rejected=people.filter(x=>x.status==="rejected").length;

document.getElementById("stats").innerHTML=
"در انتظار تأیید: "+pending+
"　 |　 منتشرشده: "+approved+
"　 |　 ردشده: "+rejected;

let box=document.getElementById("requests");

if(!people.length){
box.innerHTML="<div class='box'>هیچ درخواستی ثبت نشده.</div>";
return;
}

box.innerHTML=people.slice().reverse().map(x=>`

<div class="box">

<h3>${safe(x.name)}</h3>

<div class="info">
سن: ${safe(x.age)}<br>
شهر: ${safe(x.city)}<br>
وضعیت:
<span class="status">
${statusName(x.status)}
</span>
</div>

<p>
<a href="${safe(x.telegram)}" target="_blank">
🔗 مشاهده عکس در تلگرام
</a>
</p>

<div class="actions">

${x.status!=="approved"?
`<button class="approve" onclick="approve(${x.id})">
✅ تأیید
</button>`:""}

${x.status==="pending"?
`<button class="reject" onclick="reject(${x.id})">
❌ رد
</button>`:""}

${x.status==="approved"?
`<button class="delete" onclick="remove(${x.id})">
🗑 حذف از سایت
</button>`:""}

${x.status==="deleted"?
`<button class="restore" onclick="restore(${x.id})">
♻️ بازیابی
</button>`:""}

</div>

</div>

`).join("");
}

function approve(id){

let x=getPeople();
let item=x.find(a=>a.id===id);

if(item){
item.status="approved";
save(x);
renderAdmin();
}
}

function reject(id){

let x=getPeople();
let item=x.find(a=>a.id===id);

if(item){
item.status="rejected";
save(x);
renderAdmin();
}
}

function remove(id){

if(!confirm("این مورد از سایت حذف شود؟"))return;

let x=getPeople();
let item=x.find(a=>a.id===id);

if(item){
item.status="deleted";
save(x);
renderAdmin();
}
}

function restore(id){

let x=getPeople();
let item=x.find(a=>a.id===id);

if(item){
item.status="approved";
save(x);
renderAdmin();
}
}

function statusName(x){

if(x==="pending")return"در انتظار تأیید";
if(x==="approved")return"منتشر شده";
if(x==="rejected")return"رد شده";
if(x==="deleted")return"حذف شده";

}

function safe(x){
return String(x).replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));
}

</script>

</body>
</html>
